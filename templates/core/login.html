{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ورود بازاریاب
    </title>

    <link
        rel="stylesheet"
        href="{% static 'core/css/customer_360.css' %}"
    >

</head>

<body class="login-page">

<div class="login-shell">

    <section class="login-card">

        <div class="section-eyebrow">
            SALES AI COPILOT
        </div>

        <h1 class="login-title">
            ورود بازاریاب
        </h1>

        <p class="login-subtitle">
            برای مشاهده پیگیری‌ها و مشتریان خود وارد شوید.
        </p>


        {% if form.errors %}

            <div class="login-error">
                نام کاربری یا رمز عبور صحیح نیست.
            </div>

        {% endif %}


        <form
            method="post"
            class="login-form"
        >

            {% csrf_token %}

            <div class="login-field">

                <label for="{{ form.username.id_for_label }}">
                    نام کاربری
                </label>

                {{ form.username }}

            </div>


            <div class="login-field">

                <label for="{{ form.password.id_for_label }}">
                    رمز عبور
                </label>

                {{ form.password }}

            </div>


            {% if next %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

            {% endif %}


            <button
                type="submit"
                class="login-submit"
            >
                ورود
            </button>

        </form>

    </section>

</div>

</body>

</html>

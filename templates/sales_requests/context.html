<section class="sr-card sr-context" aria-label="مشتری و ویزیت"><div><strong><bdi>{{ customer.name }}</bdi></strong><span class="sr-caption"><bdi>{{ customer.customer_code }}</bdi></span></div><div><span>ویزیت <bdi>{{ visit.pk }}</bdi> · <bdi>{{ visit.visit_date|date:'Y/m/d' }}</bdi></span><span class="ds-badge" data-status="{{ visit.status }}">{% if visit.status == 'IN_PROGRESS' %}در حال انجام{% elif visit.status == 'PLANNED' %}برنامه‌ریزی‌شده{% elif visit.status == 'COMPLETED' %}تکمیل‌شده{% else %}لغوشده{% endif %}</span></div></section>

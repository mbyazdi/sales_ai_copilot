<figure class="rw-outcome-item" data-type="{{ item.recommendation_type }}">
    <figcaption class="rw-section-header">
        <div><strong>{% include "core/customer_360/_recommendation_type.html" with recommendation=item %}</strong><span class="ds-caption ds-muted"> · ارزیابی {% include "management/_number.html" with value=item.resolved_recommendations %} · ارائه {% include "management/_number.html" with value=item.presented %}</span></div>
        {% include "management/_quality.html" with quality=item.data_quality %}
    </figcaption>
    <div class="rw-outcome-bar" aria-hidden="true">
        <span class="rw-segment rw-segment--purchased" data-outcome="purchased" data-count="{{ item.purchased }}" style="flex-grow:{{ item.purchased }}"></span>
        <span class="rw-segment rw-segment--interested" data-outcome="interested" data-count="{{ item.interested }}" style="flex-grow:{{ item.interested }}"></span>
        <span class="rw-segment rw-segment--follow-up" data-outcome="follow_up" data-count="{{ item.follow_up }}" style="flex-grow:{{ item.follow_up }}"></span>
        <span class="rw-segment rw-segment--rejected" data-outcome="rejected" data-count="{{ item.rejected }}" style="flex-grow:{{ item.rejected }}"></span>
        <span class="rw-segment rw-segment--not-presented" data-outcome="not_presented" data-count="{{ item.not_presented }}" style="flex-grow:{{ item.not_presented }}"></span>
    </div>
    <ul class="rw-outcome-legend" aria-label="تعداد نتایج ثبت‌شده" role="list">
        <li><i class="rw-segment--purchased" aria-hidden="true"></i>خرید <strong>{% include "management/_number.html" with value=item.purchased %}</strong></li>
        <li><i class="rw-segment--interested" aria-hidden="true"></i>علاقه‌مند <strong>{% include "management/_number.html" with value=item.interested %}</strong></li>
        <li><i class="rw-segment--follow-up" aria-hidden="true"></i>پیگیری <strong>{% include "management/_number.html" with value=item.follow_up %}</strong></li>
        <li><i class="rw-segment--rejected" aria-hidden="true"></i>رد <strong>{% include "management/_number.html" with value=item.rejected %}</strong></li>
        <li><i class="rw-segment--not-presented" aria-hidden="true"></i>ارائه نشده <strong>{% include "management/_number.html" with value=item.not_presented %}</strong></li>
    </ul>
</figure>
